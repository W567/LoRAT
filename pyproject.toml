[project]
name = "LoRAT"
version = "0.1.0"
description = "Visual object tracking framework that fine-tunes pretrained ViTs (DINOv2, MAE, CLIP, EVA02, timm) with LoRA adapters. Bundles LoRAT, LoRATv2, and SPMTrack."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Wu Liqi", email = "wu.liqi@wuji.tech" }]

dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "matplotlib",
    "tqdm",
    "pyyaml",
    "wandb",
    "timm",
    "pillow",
    "tabulate",
    "fvcore",
    "exifread",
    "pyzmq",
    "safetensors",
    "psutil",
    "pyturbojpeg",
    "opencv-python>=4.13,<5",
]

[project.urls]
Repository = "https://github.com/W567/LoRAT.git"

[project.scripts]
lorat-train = "trackit.main:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trackit"]
# Hatchling bundles all files under the listed packages (including the
# YAML configs and consts.yaml.template under trackit/_resources/) by
# default, so no explicit force-include block is needed.

# ---------------------------------------------------------------------------
# Pixi-specific configuration. `pip` ignores everything under [tool.pixi.*].
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

# Conda packages — these override the PyPI versions listed in [project.dependencies]
# when pixi resolves the env. opencv is preferred from conda-forge because the PyPI
# wheel bundles its own libs and conflicts with system ffmpeg/Qt; numpy is pinned
# here for the same reason as the original pixi.toml.
[tool.pixi.dependencies]
python = "3.10.*"
pip = ">=26.1.1,<27"
opencv = ">=4.13.0,<5"
libjpeg-turbo = "*"   # system dep that pyturbojpeg links against

# Install LoRAT itself (editable) as a PyPI dependency in the pixi env.
[tool.pixi.pypi-dependencies]
LoRAT = { path = ".", editable = true }

[tool.pixi.tasks]
train = "lorat-train"
eval  = "./run.sh"
